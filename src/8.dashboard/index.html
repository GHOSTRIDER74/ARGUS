    <title>ARGUS // Telemetry — Real-Time Observability & Electronics Manufacturing Monitoring</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

              "primary": "rgb(var(--c-primary) / <alpha-value>)",
              "on-surface-variant": "rgb(var(--c-on-surface-variant) / <alpha-value>)",

              "primary-container": "rgb(var(--c-primary-container) / <alpha-value>)",
              "surface-bright": "rgb(var(--c-surface-bright) / <alpha-value>)",
              "surface-dim": "rgb(var(--c-surface-dim) / <alpha-value>)",
              "error-container": "rgb(var(--c-error-container) / <alpha-value>)",
              "on-secondary-fixed": "rgb(var(--c-on-secondary-fixed) / <alpha-value>)",
              "on-background": "rgb(var(--c-on-background) / <alpha-value>)",
              "on-primary": "rgb(var(--c-on-primary) / <alpha-value>)",
              "white": "rgb(var(--c-white) / <alpha-value>)",
              "emerald": {"50": "rgb(var(--c-emerald-50) / <alpha-value>)", "100": "rgb(var(--c-emerald-100) / <alpha-value>)", "500": "rgb(var(--c-emerald-500) / <alpha-value>)", "600": "rgb(var(--c-emerald-600) / <alpha-value>)", "700": "rgb(var(--c-emerald-700) / <alpha-value>)", "800": "rgb(var(--c-emerald-800) / <alpha-value>)"},

              "DEFAULT": "1rem",
              "lg": "2rem",
              "xl": "3rem",
              "full": "9999px"
            },
            fontFamily: {
              "display-hero-mobile": ["Space Grotesk", "sans-serif"],

              "headline-lg": ["Space Grotesk", "sans-serif"],

              "display-hero": ["56px", { "lineHeight": "64px", "letterSpacing": "-0.03em", "fontWeight": "700" }],
              "stat-display": ["64px", { "lineHeight": "68px", "letterSpacing": "-0.04em", "fontWeight": "700" }],
              "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }]

          }
        }
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        vertical-align: middle;
        line-height: 1;
      }
      .pixel-tile {
        width: 18px;
        height: 18px;
        display: inline-block;
      }
      @media (min-width: 768px) {
        .pixel-tile {
          width: 24px;
          height: 24px;
        }
      }
      .pixel-pattern {
        background-image: 
          radial-gradient(#fe8f80 1.5px, transparent 1.5px),
          radial-gradient(#fe8f80 1.5px, transparent 1.5px);
        background-size: 12px 12px;
        background-position: 0 0, 6px 6px;
      }
    </style>
  </head>
  <body class="bg-background text-on-surface antialiased font-body-md selection:bg-coral-subtle selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
