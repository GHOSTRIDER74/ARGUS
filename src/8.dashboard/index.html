    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARGUS // Telemetry — Real-Time Observability & Electronics Manufacturing Monitoring</title>

              "primary": "#000000",
              "on-surface-variant": "#444748",
              "secondary-fixed-dim": "#ffb4a9",
              "tertiary-fixed-dim": "#cac5cc",
              "on-primary-container": "#858383",
              "outline-variant": "#c4c7c7",
              "surface-variant": "#e5e2db",
              "on-tertiary-fixed-variant": "#49454c",
              "surface-container-highest": "#e5e2db",
              "primary-fixed-dim": "#c8c6c5",

              "tertiary": "#000000",

    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        vertical-align: middle;
        line-height: 1;
      }
      .pixel-tile {
        width: 18px;
        height: 18px;
        display: inline-block;
      }
      @media (min-width: 768px) {
        .pixel-tile {
          width: 24px;
          height: 24px;
        }
      }
      .pixel-pattern {
        background-image: 
          radial-gradient(#fe8f80 1.5px, transparent 1.5px),
          radial-gradient(#fe8f80 1.5px, transparent 1.5px);
        background-size: 12px 12px;
        background-position: 0 0, 6px 6px;
      }
    </style>
  </head>
  <body class="bg-background text-on-surface antialiased font-body-md selection:bg-coral-subtle selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
